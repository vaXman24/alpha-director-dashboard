name: Dashboard Freshness Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  STALE_THRESHOLD_MINUTES: 90
  LABEL: dashboard-stale

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check data.json freshness
        id: check
        run: |
          set -euo pipefail
          GENERATED_AT=$(node -e "console.log(require('./docs/data.json').generated_at)")
          GEN_EPOCH=$(date -d "$GENERATED_AT" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_MIN=$(( (NOW_EPOCH - GEN_EPOCH) / 60 ))
          echo "generated_at=$GENERATED_AT" >> "$GITHUB_OUTPUT"
          echo "age_minutes=$AGE_MIN" >> "$GITHUB_OUTPUT"
          if [ "$AGE_MIN" -gt "$STALE_THRESHOLD_MINUTES" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update stale issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_AT: ${{ steps.check.outputs.generated_at }}
          AGE_MINUTES: ${{ steps.check.outputs.age_minutes }}
        run: |
          # Retry transient GitHub API/network failures (429, 502).
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt/3); retrying" >&2
              sleep $(( attempt * 5 ))
            done
            return 1
          }

          # Housekeeping only: the label already exists and creation is idempotent,
          # so never fail the watchdog over it.
          gh label create "$LABEL" --color "B60205" \
            --description "Dashboard data feed has gone stale" --force || true

          if ! EXISTING=$(retry gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty'); then
            echo "::error::could not list issues after 3 attempts"
            exit 1
          fi

          if [ -z "$EXISTING" ]; then
            retry gh issue create \
              --title "Dashboard data is stale" \
              --label "$LABEL" \
              --body "data.json's generated_at ($GENERATED_AT) is $AGE_MINUTES minutes old, past the ${STALE_THRESHOLD_MINUTES}-minute threshold. The sentinel/publisher on the VPS has likely stopped. This issue closes automatically once fresh data lands."
          else
            retry gh issue comment "$EXISTING" \
              --body "Still stale: $AGE_MINUTES minutes old as of $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
          fi

      - name: Close stale issue if recovered
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_AT: ${{ steps.check.outputs.generated_at }}
          AGE_MINUTES: ${{ steps.check.outputs.age_minutes }}
        run: |
          # Retry transient GitHub API/network failures (429, 502).
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt/3); retrying" >&2
              sleep $(( attempt * 5 ))
            done
            return 1
          }

          if ! EXISTING=$(retry gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty'); then
            echo "::error::could not list issues after 3 attempts"
            exit 1
          fi

          if [ -n "$EXISTING" ]; then
            retry gh issue comment "$EXISTING" \
              --body "Recovered: data.json generated_at is now $GENERATED_AT ($AGE_MINUTES min old)."
            retry gh issue close "$EXISTING"
          fi
